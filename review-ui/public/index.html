<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRD Genie — Review</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1a17; --muted: #6b6560;
    --line: #e5e0d8; --accent: #2f6f4f; --accent-soft: #e8f2ec;
    --warn: #9a6400; --warn-soft: #fdf4e0; --mark: #ffe9a8;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 620; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 53px); }
  .col { overflow-y: auto; padding: 18px 20px; }
  .col + .col { border-left: 1px solid var(--line); background: var(--panel); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .col + .col .card { background: var(--bg); }
  .card.ungrounded { border-color: #e6cf9b; background: var(--warn-soft); }
  .statement { font-weight: 560; margin-bottom: 6px; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 99px;
         background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 600; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px;
           background: #f5e2bb; color: var(--warn); font-size: 11.5px; font-weight: 600; }
  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12.5px; padding: 3px 9px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip.dead { opacity: .55; cursor: not-allowed; text-decoration: line-through; }

  pre#source {
    white-space: pre-wrap; word-break: break-word; font: 13.5px/1.7 ui-monospace, Menlo, Consolas, monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin: 0;
  }
  mark { background: var(--mark); border-radius: 3px; padding: 1px 0; }

  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: var(--radius);
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { background: #c9c4bc; cursor: not-allowed; }
  .caveat {
    border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--warn);
    padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 13px;
    margin-bottom: 14px;
  }
  .approved { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>PRD Genie</h1>
  <span class="sub" id="subtitle">loading…</span>
  <a href="/attention.html" id="attention">needs attention</a>
  <a href="/history.html">history</a>
  <a href="/metrics.html">metrics</a>
  <a href="/judge.html">judge sweeps</a>
  <a href="/api/health">health</a>
</header>

<main>
  <div class="col">
    <div class="bar">
      <select id="picker"></select>
      <button class="primary" id="signoff" disabled>Sign off</button>
    </div>
    <div id="caveat"></div>
    <h2 id="reqheading">Requirements</h2>
    <div id="requirements"></div>
  </div>
  <div class="col">
    <h2 id="sourceheading">Source document</h2>
    <pre id="source" class="empty">Click a citation to see where it came from.</pre>
  </div>
</main>

<script>
// No framework, no build step (ADR 0009). Small enough to read end to end.
const $ = (id) => document.getElementById(id);
let version = null, doc = null, active = null;

// EVERYTHING from the server is treated as untrusted text. Source documents are
// attacker-controlled (fixture H1 exists) and are rendered into this page.
// textContent, never innerHTML — this is a security control, not a style choice.
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

async function boot() {
  const { versions } = await (await fetch('/api/prd-versions')).json();
  const picker = $('picker');
  picker.replaceChildren();
  if (!versions.length) {
    $('subtitle').textContent = 'nothing to review yet';
    picker.append(el('option', null, 'no versions'));
    return;
  }
  for (const v of versions) {
    const label = `${v.prd_id} v${v.version_no} — ${v.state}` +
      (v.park_reason ? ` (parked: ${v.park_reason})` : ` — ${v.grounded}/${v.requirements} grounded`);
    const o = el('option', null, label);
    o.value = v.prd_version_id;
    picker.append(o);
  }
  picker.onchange = () => load(picker.value);
  load(versions[0].prd_version_id);
}

async function load(id) {
  version = await (await fetch(`/api/prd-versions/${id}`)).json();
  doc = null; active = null;
  const docIds = version.content?.source_doc_ids ?? [];
  if (docIds.length) doc = await (await fetch(`/api/documents/${docIds[0]}`)).json();

  $('subtitle').textContent = `${version.prd_id} v${version.version_no} · ${version.state}`;
  $('sourceheading').textContent = doc ? `Source: ${doc.title}` : 'Source document';
  renderCaveat();
  renderRequirements();
  $('source').textContent = doc ? doc.raw_text : 'No source document linked.';
  $('source').className = doc ? '' : 'empty';

  const btn = $('signoff');
  btn.disabled = version.state !== 'in_review';
  btn.textContent = version.state === 'approved' ? 'Approved' : 'Sign off';
  btn.onclick = signOff;
}

// The caveat line is COMPUTED FROM STATE, never written as prose (docs/reporting.md).
function renderCaveat() {
  const box = $('caveat');
  box.replaceChildren();
  const reqs = version.requirements ?? [];
  const ungrounded = reqs.filter((r) => !r.grounded).length;
  const notes = [];
  if (version.park_reason) notes.push(`This run parked: ${version.park_reason}. It is not a normal draft.`);
  if (version.degraded) notes.push('A fallback was engaged during generation.');
  if (ungrounded) notes.push(`${ungrounded} of ${reqs.length} requirements could not be verified against the source.`);
  if (version.state === 'approved') notes.push('Approved. This version is now a record and cannot be edited.');
  if (!notes.length) return;
  box.append(el('div', version.state === 'approved' ? 'caveat approved' : 'caveat', notes.join(' ')));
}

function renderRequirements() {
  const wrap = $('requirements');
  wrap.replaceChildren();
  const reqs = version.requirements ?? [];
  $('reqheading').textContent = `Requirements (${reqs.filter((r) => r.grounded).length}/${reqs.length} grounded)`;
  if (!reqs.length) {
    wrap.append(el('p', 'empty', 'No requirements on this version.'));
    return;
  }
  for (const r of reqs) {
    const card = el('div', r.grounded ? 'card' : 'card ungrounded');
    card.append(el('div', 'statement', r.statement));

    const meta = el('div', 'meta');
    meta.append(el('span', 'tag', r.kind));
    if (r.stakeholder) meta.append(el('span', null, r.stakeholder));
    if (r.confidence) meta.append(el('span', null, `confidence: ${r.confidence}`));
    if (!r.grounded) meta.append(el('span', 'badge', 'UNGROUNDED — verify manually'));
    card.append(meta);

    const chips = el('div', 'chips');
    for (const c of r.citations ?? []) {
      const found = c.match_kind !== 'not_found' && c.start_char !== null;
      const chip = el('button', found ? 'chip' : 'chip dead', `“${c.quote}”`);
      chip.title = found ? `${c.match_kind} @ ${c.start_char}` : 'not found in the source';
      if (found) chip.onclick = () => highlight(c, chip);
      else chip.disabled = true;
      chips.append(chip);
    }
    card.append(chips);
    wrap.append(card);
  }
}

// Highlight using the offsets the GROUNDING CHECK rewrote, never the model's originals
// (ADR 0003). Highlighting the wrong sentence is worse than highlighting nothing,
// because it looks verified.
function highlight(citation, chip) {
  if (!doc) return;
  document.querySelectorAll('.chip.active').forEach((c) => c.classList.remove('active'));
  chip.classList.add('active');
  active = citation;

  const text = doc.raw_text;
  const pre = $('source');
  pre.replaceChildren();
  pre.append(document.createTextNode(text.slice(0, citation.start_char)));
  const m = el('mark', null, text.slice(citation.start_char, citation.end_char));
  pre.append(m);
  pre.append(document.createTextNode(text.slice(citation.end_char)));
  m.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

async function signOff() {
  const btn = $('signoff');
  btn.disabled = true;
  const res = await fetch(`/api/prd-versions/${version.prd_version_id}/sign-off`, { method: 'POST' });
  const body = await res.json();
  if (!res.ok) {
    alert(`Sign-off refused: ${body.reason}\n${body.detail ?? ''}`);
    btn.disabled = false;
    return;
  }
  await boot();
}

boot();
</script>
</body>
</html>
